<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android APK Build Server</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%233ddc84'/%3E%3Cstop offset='1' stop-color='%2307a845'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='16' y='16' text-anchor='middle' dominant-baseline='central' fill='white' font-family='system-ui,sans-serif' font-size='18' font-weight='700'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/build/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Android APK Build Server</h1>
      <a href="/init/" class="nav-link">Configure Workplaces</a>
    </header>

    <main>
      <!-- Step 1: Select Project -->
      <section class="step" id="step-project">
        <h2>1. 选择项目</h2>
        <div class="project-list" id="project-list">
          <div class="loading">加载中...</div>
        </div>
      </section>

      <!-- Step 2: Select Branch -->
      <section class="step hidden" id="step-branch">
        <h2>2. 选择分支</h2>
        <div class="form-group">
          <select id="branch-select">
            <option value="">请选择分支</option>
          </select>
          <button id="fetch-branches-btn" class="btn btn-secondary">获取所有分支</button>
          <button id="checkout-branch-btn" class="btn btn-primary hidden">切换分支</button>
        </div>
        <div class="branch-log hidden" id="branch-log">
          <div class="branch-log-title">最近提交记录</div>
          <div class="branch-log-list" id="branch-log-list"></div>
        </div>
      </section>

      <!-- Step 3: Select Module -->
      <section class="step hidden" id="step-module">
        <h2>3. 选择模块</h2>
        <div class="form-group">
          <select id="module-select">
            <option value="">请选择模块</option>
          </select>
        </div>
      </section>

      <!-- Step 4: Select Variant & Version -->
      <section class="step hidden" id="step-config">
        <h2>4. 配置版本</h2>
        <div class="form-row">
          <div class="form-group">
            <label>变体 (Variant)</label>
            <select id="variant-select"></select>
          </div>
          <div class="form-group" id="jdk-version-group">
            <label>JDK 版本</label>
            <select id="jdk-version-select">
              <option value="">使用默认</option>
            </select>
          </div>
        </div>
        <div class="form-row hidden" id="env-row">
          <div class="form-group">
            <label>环境 (Env)</label>
            <select id="env-select">
              <option value="dev">dev</option>
              <option value="prod">prod</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Version Code</label>
            <input type="number" id="version-code" min="1">
          </div>
          <div class="form-group">
            <label>Version Name</label>
            <input type="text" id="version-name">
          </div>
        </div>
        <div class="form-row form-row-checkbox">
          <label class="toggle-label">
            <span class="toggle-switch">
              <input type="checkbox" id="use-cache-checkbox" checked>
              <span class="toggle-slider"></span>
            </span>
            <span class="toggle-text">使用缓存构建</span>
          </label>
        </div>
        <button id="build-btn" class="btn btn-success">开始构建</button>
      </section>

      <!-- Step 5: Build Progress -->
      <section class="step hidden" id="step-build">
        <h2>5. 构建进度</h2>
        <div class="build-status" id="build-status">
          <span class="status-text">准备中...</span>
        </div>
        <div class="log-info" id="log-info"></div>
        <div class="build-logs-container" id="build-logs-container">
          <div class="loading">选择项目后加载日志</div>
        </div>
      </section>

      <!-- APK Build History List -->
      <section class="step hidden" id="step-apk-list">
        <h2>APK 构建列表</h2>
        <div id="apk-list" class="apk-list"></div>
      </section>
    </main>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay hidden" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loading-text">加载中...</div>
  </div>

  <script src="/build/js/app.js?v=19"></script>
</body>
</html>
