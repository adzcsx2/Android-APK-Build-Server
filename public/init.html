<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace 配置</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%233ddc84'/%3E%3Cstop offset='1' stop-color='%2307a845'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='16' y='16' text-anchor='middle' dominant-baseline='central' fill='white' font-family='system-ui,sans-serif' font-size='18' font-weight='700'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/init/css/style.css">
</head>
<body>
  <!-- Password Overlay -->
  <div id="password-overlay" class="password-overlay">
    <div class="password-card">
      <h2>请输入密码</h2>
      <div class="form-group">
        <input type="password" id="password-input" placeholder="密码" autocomplete="off">
      </div>
      <div id="password-error" class="status-message hidden"></div>
      <button id="password-btn" class="btn btn-primary">确认</button>
    </div>
  </div>

  <!-- Main Content (hidden until password verified) -->
  <div id="main-content" class="container hidden">
    <header>
      <h1>Workplace 配置</h1>
      <a href="/build/" class="nav-link">返回构建页面</a>
    </header>

    <main>
      <!-- Scan Section -->
      <section class="step">
        <h2>扫描项目目录</h2>
        <div class="scan-form">
          <div class="form-group">
            <label>目录路径</label>
            <input type="text" id="scan-path" placeholder="例如: D:\AndroidWorkplace">
          </div>
          <div class="scan-actions">
            <button id="scan-btn" class="btn btn-primary">扫描</button>
            <button id="add-path-btn" class="btn btn-success" disabled>添加到列表</button>
          </div>
        </div>
        <div id="scan-status" class="status-message hidden"></div>

        <!-- Preview Section -->
        <div id="preview-section" class="preview-section hidden">
          <h3>找到的项目</h3>
          <div id="project-preview" class="project-preview"></div>
        </div>
      </section>

      <!-- Configured Paths -->
      <section class="step">
        <h2>已配置的工作目录</h2>
        <div id="path-list" class="path-list">
          <div class="loading">加载中...</div>
        </div>
        <div id="save-status" class="status-message hidden"></div>
      </section>

      <!-- JDK Configuration -->
      <section class="step">
        <h2>JDK 版本配置</h2>
        <div class="jdk-add-form">
          <div class="form-row">
            <div class="form-group">
              <label>名称</label>
              <input type="text" id="jdk-name" placeholder="例如: JDK 17">
            </div>
            <div class="form-group">
              <label>版本号</label>
              <input type="number" id="jdk-version" placeholder="17" min="1" max="99">
            </div>
          </div>
          <div class="form-group">
            <label>安装路径</label>
            <input type="text" id="jdk-path" placeholder="例如: C:\Users\xxx\.jdks\ms-17.0.18">
          </div>
          <div class="jdk-actions">
            <button id="validate-jdk-btn" class="btn btn-secondary">验证路径</button>
            <button id="add-jdk-btn" class="btn btn-success">添加 JDK</button>
          </div>
        </div>
        <div id="jdk-validate-status" class="status-message hidden"></div>
        <div id="jdk-list" class="jdk-list">
          <div class="loading">加载中...</div>
        </div>
        <div id="jdk-status" class="status-message hidden"></div>
      </section>
    </main>
  </div>

  <script src="/init/js/init.js"></script>
</body>
</html>
